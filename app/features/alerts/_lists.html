{% if not groups %}
<div class="rounded-xl border border-dashed border-slate-300 bg-white p-10 text-center text-sm text-slate-500">No early warnings match. Try another filter.</div>
{% endif %}
{% for p, label, items in groups %}
<section class="mb-7">
  <h2 class="mb-2 flex items-center gap-2 text-sm font-bold text-slate-900">
    <span class="rounded-md px-2 py-0.5 text-xs font-bold ring-1 {{ {'P1':'bg-red-50 text-red-700 ring-red-200','P2':'bg-amber-50 text-amber-700 ring-amber-200','P3':'bg-slate-100 text-slate-600 ring-slate-200'}[p] }}">{{ p }}</span>{{ label }}
    <span class="font-medium text-slate-400">({{ items|length }})</span>
  </h2>
  <div class="space-y-3">
    {% for a in items %}{% include "alerts/_card.html" %}{% endfor %}
  </div>
</section>
{% endfor %}
