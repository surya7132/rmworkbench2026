<div class="grid grid-cols-2 gap-4 lg:grid-cols-4">
  {% set tone = {'P1': ('bg-red-50 text-red-700 ring-red-200', 'bg-red-500'), 'P2': ('bg-amber-50 text-amber-700 ring-amber-200', 'bg-amber-400'), 'P3': ('bg-slate-100 text-slate-600 ring-slate-200', 'bg-slate-400')} %}
  <label data-v="all" class="cursor-pointer rounded-2xl border bg-white p-4 shadow-sm transition hover:shadow-md" :class="prio === $el.dataset.v ? 'border-navy-700 ring-2 ring-navy-700/20' : 'border-slate-200'">
    <input type="radio" name="prio" value="all" x-model="prio" class="sr-only" {% if prio == 'all' %}checked{% endif %}>
    <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Everything open</div>
    <div class="mt-2 text-4xl font-extrabold tabular-nums text-slate-900">{{ summary.total }}</div>
    <div class="mt-0.5 text-sm text-slate-600">{{ summary.new }} still to triage</div>
  </label>
  {% for p in ['P1', 'P2', 'P3'] %}
  <label data-v="{{ p }}" class="group relative cursor-pointer rounded-2xl border bg-white p-4 shadow-sm transition hover:shadow-md" :class="prio === $el.dataset.v ? 'border-navy-700 ring-2 ring-navy-700/20' : 'border-slate-200'" title="{{ prio_text[p][1] }}">
    <input type="radio" name="prio" value="{{ p }}" x-model="prio" class="sr-only" {% if prio == p %}checked{% endif %}>
    <div class="flex items-center justify-between"><span class="rounded-md px-2 py-0.5 text-xs font-bold ring-1 {{ tone[p][0] }}">{{ p }}</span><span class="text-[11px] font-medium text-slate-400">{{ prio_text[p][0] }}</span></div>
    <div class="mt-2 text-4xl font-extrabold tabular-nums text-slate-900">{{ summary.prio[p].open }}</div>
    <div class="mt-0.5 text-sm text-slate-600">{{ summary.prio[p].new }} still to triage</div>
    <div class="mt-3 h-1.5 overflow-hidden rounded-full bg-slate-100"><div class="h-full rounded-full {{ tone[p][1] }}" data-w="{{ (100 * summary.prio[p].open / summary.total)|round|int if summary.total else 0 }}" :style="{ width: $el.dataset.w + '%' }"></div></div>
  </label>
  {% endfor %}
</div>
